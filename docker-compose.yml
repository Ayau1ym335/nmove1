services:

  db:
    image: timescale/timescaledb:latest-pg15
    container_name: nmove_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-nmove}
    ports:
      - "5433:5432"
    volumes:
      - nmove_db:/var/lib/postgresql/data
    networks:
      - nmove_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nmove}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nmove_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nmove_redis:/data
    networks:
      - nmove_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nmove_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nmove_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nmove_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nmove_minio:/data
    command: server /data --console-address ":9001"
    networks:
      - nmove_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nmove_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override to ensure Docker service names are used (not localhost)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-nmove}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nmove_net


  celery_worker:
    build:
      context: ./backend
      dockerfile: docker/celery.Dockerfile
    container_name: nmove_celery_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override to ensure Docker service names are used (not localhost)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-nmove}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    networks:
      - nmove_net

  flower:
    image: mher/flower:2.0
    container_name: nmove_flower
    restart: always
    depends_on:
      - redis
      - celery_worker
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=admin:nmoveflower
    networks:
      - nmove_net
    command: celery --broker=redis://redis:6379/0 flower --port=5555

networks:
  nmove_net:
    driver: bridge

volumes:
  nmove_db:
  nmove_redis:
  nmove_minio:
