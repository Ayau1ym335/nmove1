services:

  db:
    image: timescale/timescaledb:latest-pg15
    container_name: nmove_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-nmove}
    ports:
      - "5433:5432"
    volumes:
      - nmove_db:/var/lib/postgresql/data
    networks:
      - nmove_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nmove}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nmove_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nmove_redis:/data
    networks:
      - nmove_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nmove_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nmove_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nmove_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nmove_minio:/data
    command: server /data --console-address ":9001"
    networks:
      - nmove_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: nmove_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-changeme_enc_key}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nmove}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
    volumes:
      - nmove_n8n:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nmove_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nmove_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override to ensure Docker service names are used (not localhost)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-nmove}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nmove_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: docker/celery.Dockerfile
    container_name: nmove_celery_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - ./backend:/app
    networks:
      - nmove_net
    command: >
      celery -A celery_app worker
      --loglevel=info
      --queues=gait_processing
      --concurrency=2
      --hostname=nmove-worker@%h

  flower:
    image: mher/flower:2.0
    container_name: nmove_flower
    restart: always
    depends_on:
      - redis
      - celery_worker
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=${REDIS_URL}
      - FLOWER_BASIC_AUTH=admin:nmoveflower
    networks:
      - nmove_net
    command: >
      celery
      --broker=${REDIS_URL}
      flower
      --port=5555

networks:
  nmove_net:
    driver: bridge

volumes:
  nmove_db:
  nmove_redis:
  nmove_minio:
  nmove_n8n:
